name: Full Proof Replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12.11"
      - run: >-
          python -I -m pip install --isolated --no-input --no-cache-dir
          --require-hashes --only-binary=:all: --no-deps
          --index-url https://pypi.org/simple -r requirements-replay.txt
      - name: Replay residual proof
        run: make verify-residual-case PYTHON=python
      - name: Assert residual replay is read-only
        run: git diff --exit-code -- evidence
      - name: Assert residual replay creates no evidence files
        run: >-
          test -z
          "$(git status --porcelain --untracked-files=all -- evidence)"
      - name: Replay remaining proof bundles
        run: |
          make \
            test \
            audit-min-distance-proofs \
            audit-third-word-proofs \
            case-reduction \
            audit-fourth-word-rup-proofs \
            verify-release-manifest \
            PYTHON=python
      - name: Assert no tracked files changed
        if: always()
        run: git diff --exit-code
      - name: Assert no untracked files remain
        if: always()
        run: test -z "$(git status --porcelain --untracked-files=all)"
