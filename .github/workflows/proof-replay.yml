name: Full Proof Replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-sat.txt -r requirements-proof.txt
      - run: make test PYTHON=python
      - run: make proof-checker PYTHON=python
      - run: make verify-residual-case PYTHON=python
      - run: make audit-min-distance-proofs PYTHON=python
      - run: make audit-third-word-proofs PYTHON=python
      - run: make case-reduction PYTHON=python
