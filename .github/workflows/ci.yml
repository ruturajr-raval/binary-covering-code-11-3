name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -I -m venv .venv
      - run: >-
          .venv/bin/python -I -m pip install --isolated --no-input --no-cache-dir
          --require-hashes --only-binary=:all: --no-deps
          --index-url https://pypi.org/simple -r requirements-replay.txt
      - run: make third-word-child-formula-smoke fourth-word-formula-smoke PYTHON=.venv/bin/python
      - run: make test PYTHON=.venv/bin/python
      - if: matrix.python-version == '3.9'
        run: make fourth-word-rup-proof-smoke PYTHON=.venv/bin/python
      - run: make audit-third-word-child-frontier PYTHON=.venv/bin/python
      - run: make audit-fourth-word-hard-frontier PYTHON=.venv/bin/python
      - run: make audit-fourth-word-rup-plan PYTHON=.venv/bin/python
      - run: make verify-baseline verify-independent PYTHON=.venv/bin/python
      - run: make distance-bounds overlap-bound PYTHON=.venv/bin/python
      - run: make verify-technical-report PYTHON=.venv/bin/python
      - run: make audit-two-word-cases PYTHON=.venv/bin/python
      - name: Verify retained orbit LP certificates
        run: >-
          PYTHONPATH=src:tools .venv/bin/python
          tools/verify_orbit_lp_certificates.py
          evidence/two-word-cases.json
          evidence/orbit-lp-certificates.json
      - name: Verify retained integer profile certificates
        run: >-
          PYTHONPATH=src:tools .venv/bin/python
          tools/verify_integer_profile_certificates.py
          evidence/two-word-cases.json
          evidence/integer-profile-certificates.json
      - run: make verify-release-manifest PYTHON=.venv/bin/python
      - name: Verify historical v0.2.0 certificate revisions
        if: matrix.python-version == '3.12'
        run: |
          cert_dir="$RUNNER_TEMP/k2-11-3-v0.2.0"
          certified_revision=7f5a3b524d703985b5e6c36270173578598c8b3a
          git worktree add --detach "$cert_dir" "$certified_revision"
          cd "$cert_dir"
          python -I -m venv .venv
          .venv/bin/python -I -m pip install \
            --isolated --no-input --no-cache-dir \
            --require-hashes --only-binary=:all: --no-deps \
            --index-url https://pypi.org/simple -r requirements-replay.txt
          cert_python="$cert_dir/.venv/bin/python"
          "$cert_python" -I -m unittest discover \
            -s release-tools/tests -v
          make \
            check-fourth-word-rup-proof-index \
            verify-fourth-word-rup-revision \
            PYTHON="$cert_python"
          make -C proof-expansion \
            test audit-plan audit-bundle-structure \
            PYTHON="$cert_python"
          "$cert_python" \
            tools/verify_checksum_manifest.py \
            proof-expansion/evidence/fourth-word-solver-drat-bundle-v2.sha256 \
            --path proof-expansion/evidence/fourth-word-solver-drat-plan-v2.json \
            --path proof-expansion/evidence/fourth-word-solver-drat-index-v2.json \
            --tree proof-expansion/evidence/proofs/fourth-word-solver-drat-v2
          record=proof-expansion/evidence/fourth-word-solver-drat-revision-v2.json
          if test -f "$record"; then
            "$cert_python" -I \
              release-tools/manage_fourth_word_solver_drat_revision.py \
              --verify \
              --release-revision "$(git rev-parse HEAD)"
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$cert_dir"
      - name: Assert no tracked files changed
        if: always()
        run: git diff --exit-code

  paper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Tectonic
        run: |
          mkdir -p build/tectonic
          curl -fL \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.16.9/tectonic-0.16.9-x86_64-unknown-linux-gnu.tar.gz \
            -o build/tectonic/tectonic.tar.gz
          echo "f3c825128095dc3399ea11c08c18035b33050a216930c295c79e8eb11bd21de4  build/tectonic/tectonic.tar.gz" \
            | sha256sum --check
          tar -xzf build/tectonic/tectonic.tar.gz -C build/tectonic
      - run: make paper-build TECTONIC="$PWD/build/tectonic/tectonic"
      - run: make paper-bundle
      - run: make release-assets
      - run: make verify-release-assets
      - run: git diff --exit-code -- dist/arxiv/binary-covering-code-11-3.tar.gz
      - run: git diff --exit-code -- dist/release
      - run: tar -tzf dist/arxiv/binary-covering-code-11-3.tar.gz
      - run: >-
          tar -tzf
          dist/release/binary-covering-code-11-3-v0.3.1-paper-source.tar.gz
      - run: mkdir -p build/arxiv-extracted
      - run: >-
          cmp dist/arxiv/binary-covering-code-11-3.tar.gz
          dist/release/binary-covering-code-11-3-v0.3.1-paper-source.tar.gz
      - run: >-
          tar -xzf
          dist/release/binary-covering-code-11-3-v0.3.1-paper-source.tar.gz
          -C build/arxiv-extracted
      - run: python3 replay.py
        working-directory: build/arxiv-extracted
      - run: mkdir -p compiled
        working-directory: build/arxiv-extracted
      - run: >-
          SOURCE_DATE_EPOCH=1788739200 FORCE_SOURCE_DATE=1
          TECTONIC_CACHE_DIR="$GITHUB_WORKSPACE/build/tectonic-cache"
          "$GITHUB_WORKSPACE/build/tectonic/tectonic"
          -X compile main.tex --outdir compiled --keep-logs
        working-directory: build/arxiv-extracted
      - name: Compare source-built and released PDFs
        run: >-
          cmp build/arxiv-extracted/compiled/main.pdf
          dist/release/binary-covering-code-11-3-v0.3.1-paper.pdf
